name: Build and publish binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the build artifacts as a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag (for example, v1.0.0); blank uses build-<run number>
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            compiler: g++
            flags: ""
            extension: ""
          - os: linux
            arch: x86
            runner: ubuntu-latest
            compiler: g++
            flags: "-m32"
            extension: ""
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            compiler: g++
            flags: ""
            extension: ""
          - os: macos
            arch: x64
            runner: macos-14
            compiler: clang++
            flags: "-arch x86_64"
            extension: ""
          - os: macos
            arch: arm64
            runner: macos-14
            compiler: clang++
            flags: "-arch arm64"
            extension: ""
          - os: windows
            arch: x64
            runner: windows-latest
            msvc_arch: amd64
            extension: ".exe"
          - os: windows
            arch: x86
            runner: windows-latest
            msvc_arch: amd64_x86
            extension: ".exe"
          - os: windows
            arch: arm64
            runner: windows-latest
            msvc_arch: amd64_arm64
            extension: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux 32-bit toolchain
        if: matrix.os == 'linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++-multilib

      - name: Configure MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build Unix binary
        if: matrix.os != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          make clean-release
          make build-release \
            CXX="${{ matrix.compiler }}" \
            RELEASE_CXXFLAGS="-std=c++17 -Wall -Wextra -pedantic -O2 ${{ matrix.flags }}" \
            RELEASE_TARGET="dist/grocery-${{ matrix.os }}-${{ matrix.arch }}"

      - name: Build Windows binary
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $sources = @("main.cpp") + (Get-ChildItem -Path src -Recurse -Filter *.cpp | ForEach-Object { $_.FullName })
          $objects = @()
          for ($i = 0; $i -lt $sources.Count; $i++) {
            $object = "dist\obj\$i.obj"
            New-Item -ItemType Directory -Force (Split-Path $object) | Out-Null
            cl.exe /nologo /std:c++17 /EHsc /W4 /O2 /Iinclude /I. /c $sources[$i] /Fo$object
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $objects += $object
          }
          cl.exe /nologo $objects `
            /Fe:"dist\grocery-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package binary
        shell: bash
        run: |
          archive="grocery-${{ matrix.os }}-${{ matrix.arch }}"
          tar -czf "dist/${archive}.tar.gz" -C dist "grocery-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/grocery-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: grocery-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          tag_name: ${{ inputs.release_tag || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
